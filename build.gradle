import java.util.Properties

def isJitpack = (System.getenv("JITPACK") == "true")

if (isJitpack) {
    def androidHome = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (androidHome) {
        File sdkDir = new File(androidHome)

        // Prefer ndk-bundle, else pick the newest side-by-side NDK under $ANDROID_HOME/ndk/<version>
        File ndkDir = new File(sdkDir, "ndk-bundle")
        if (!ndkDir.exists()) {
            File ndkRoot = new File(sdkDir, "ndk")
            if (ndkRoot.exists()) {
                def versions = (ndkRoot.listFiles() ?: [])
                        .findAll { it.isDirectory() }
                        .sort { it.name }
                if (!versions.isEmpty()) {
                    ndkDir = versions.last()
                }
            }
        }

        File propsFile = rootProject.file("local.properties")
        Properties props = new Properties()
        if (propsFile.exists()) {
            propsFile.withInputStream { props.load(it) }
        }

        boolean changed = false
        if (!props.getProperty("sdk.dir")) {
            props.setProperty("sdk.dir", sdkDir.absolutePath)
            changed = true
        }

        // Even if we didn't find an existing NDK folder, write a best-guess path so we never end up with null
        if (!props.getProperty("ndk.dir")) {
            def ndkPath = ndkDir.exists()
                    ? ndkDir.absolutePath
                    : new File(sdkDir, "ndk-bundle").absolutePath
            props.setProperty("ndk.dir", ndkPath)
            changed = true
        }

        if (changed) {
            propsFile.withOutputStream { props.store(it, null) }
            println("JitPack: wrote local.properties with sdk.dir=${props.getProperty('sdk.dir')} ndk.dir=${props.getProperty('ndk.dir')}")
        } else {
            println("JitPack: local.properties already had sdk.dir and ndk.dir")
        }
    } else {
        println("JitPack: ANDROID_HOME/ANDROID_SDK_ROOT not set")
    }
}

// Top-level build file where you can add configuration options libuvccommon to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://artifactory.appodeal.com/appodeal-public" }
        jcenter() // optional: keep only if something truly still needs it
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.2'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.5.20'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://artifactory.appodeal.com/appodeal-public" }
        jcenter()
        maven { url "https://jitpack.io" }
    }

    ext {
        androidXVersion = '1.3.1'
        versionCompiler = 29
        versionTarget = 27
        minSdkVersion = 19
        versionCode = 126
        versionNameString = '3.3.3'
        javaSourceCompatibility = JavaVersion.VERSION_1_8
        javaTargetCompatibility = JavaVersion.VERSION_1_8
        supportLibVersion = '27.1.1'
        versionBuildTool = '30.0.2'
        kotlinCoreVersion = '1.3.2'
        kotlinCoroutines = '1.3.9'
        materialVersion = '1.3.0'
        constraintlayoutVersion = '2.0.4'
        lifecycle_version = '2.2.0'
        quick_version= '2.9.50'
        dialog_version= '3.2.1'
        bugly_version = '3.4.4'
        bugly_native_version = '3.9.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects { proj ->
    proj.plugins.withId("com.android.library") {
        proj.apply plugin: "com.github.dcendents.android-maven"

        def groupBase = System.getenv("GROUP") ?: "com.github.gkalman1"
        def repoName  = System.getenv("ARTIFACT") ?: "AndroidUSBCamera"
        def ver       = System.getenv("VERSION") ?: "LOCAL"

        proj.group = "${groupBase}.${repoName}"
        proj.version = ver
    }
}

tasks.register("publishToMavenLocal") {
    dependsOn(":libausbc:install", ":libnative:install", ":libuvc:install")
}

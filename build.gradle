// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        // Keep only if you truly need it; otherwise you can remove later
        maven { url "https://artifactory.appodeal.com/appodeal-public" }
        jcenter()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.2.2"
        classpath "com.github.dcendents:android-maven-gradle-plugin:2.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.5.20"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://artifactory.appodeal.com/appodeal-public" }
        jcenter()
        maven { url "https://jitpack.io" }
    }
}

/**
 * IMPORTANT:
 * - compileSdk must be >= 33 because your USBMonitor.java references:
 *   - Build.VERSION_CODES.S (31)
 *   - Build.VERSION_CODES.TIRAMISU (33)
 *   - PendingIntent.FLAG_MUTABLE (31)
 *   - Context.RECEIVER_NOT_EXPORTED (33)
 *
 * Your app can targetSdk 35 for Play; the library can compileSdk 33+ and still be consumed fine.
 */
ext {
    androidXVersion = "1.3.1"

    // Must be 33+ for those symbols to exist at compile time
    versionCompiler = 33
    versionTarget = 33

    // Keep as-is unless you intentionally want to raise minSdk
    minSdkVersion = 19

    versionCode = 126
    versionNameString = "3.3.3"

    javaSourceCompatibility = JavaVersion.VERSION_1_8
    javaTargetCompatibility = JavaVersion.VERSION_1_8

    supportLibVersion = "27.1.1"
    // versionBuildTool = "27.0.3"

    kotlinCoreVersion = "1.3.2"
    kotlinCoroutines = "1.3.9"

    materialVersion = "1.3.0"
    constraintlayoutVersion = "2.0.4"
    lifecycle_version = "2.2.0"

    quick_version = "2.9.50"
    dialog_version = "3.2.1"
    bugly_version = "3.4.4"
    bugly_native_version = "3.9.0"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

/**
 * Make sure JitPack coordinates are stable and match what JitPack passes:
 * JitPack invokes Gradle with -Pgroup=... and -Pversion=...
 */
subprojects { proj ->
    proj.plugins.withId("com.android.library") {
        proj.apply plugin: "com.github.dcendents.android-maven"

        // JitPack passes these as Gradle properties (-Pgroup, -Pversion)
        def groupBase = (rootProject.findProperty("group") ?: "com.github.gkalman1").toString()
        def repoName  = "AndroidUSBCamera"
        def ver       = (rootProject.findProperty("version") ?: "LOCAL").toString()

        proj.group = "${groupBase}.${repoName}"
        proj.version = ver
    }
}

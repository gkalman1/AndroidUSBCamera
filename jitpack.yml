jdk:
  - openjdk11

before_install:
  - echo "ANDROID_HOME=$ANDROID_HOME"
  - echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

  # Find sdkmanager on JitPack images (path varies)
  - |
    if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
      SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
    elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
      SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
    else
      echo "sdkmanager not found"; find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f || true; exit 1
    fi
    echo "Using sdkmanager at: $SDKMANAGER"
    yes | "$SDKMANAGER" --licenses

    # Install platform tools + build tools + a known-good NDK that includes ndk-build
    "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;21.4.7075529"

    export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.4.7075529"
    echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

    # Many older builds look for ndk-bundle explicitly
    ln -sfn "$ANDROID_NDK_HOME" "$ANDROID_HOME/ndk-bundle"

    # This project’s Gradle often relies on local.properties for ndkDirectory
    printf "sdk.dir=%s\nndk.dir=%s\n" "$ANDROID_HOME" "$ANDROID_NDK_HOME" > local.properties

    # Verify ndk-build exists (this is what your failure complains about)
    ls -la "$ANDROID_NDK_HOME/ndk-build" || true
    "$ANDROID_NDK_HOME/ndk-build" --version || true

install:
  - ./gradlew -v
  - ./gradlew clean publishToMavenLocal -x test

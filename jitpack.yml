jdk:
  - openjdk11   # use openjdk17 only if you upgraded to AGP 8.x

before_install:
  - echo "ANDROID_HOME=$ANDROID_HOME"
  - rm -rf "$ANDROID_HOME/ndk-bundle"
  - curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip
  - unzip -q ndk.zip
  - mv android-ndk-r20b "$ANDROID_HOME/ndk-bundle"
  - rm -f ndk.zip
  - echo "sdk.dir=$ANDROID_HOME" > local.properties
  - echo "ndk.dir=$ANDROID_HOME/ndk-bundle" >> local.properties
  - "$ANDROID_HOME/ndk-bundle/ndk-build" --version

install:
  - |
    ./gradlew --no-daemon clean \
      :libnative:publishToMavenLocal \
      :libuvc:publishToMavenLocal \
      :libausbc:publishToMavenLocal \
      --stacktrace --info \
      -x test -x lint -x check

jdk:
  - openjdk8

before_install:
  - echo "USING jitpack.yml"
  - echo "ANDROID_HOME=$ANDROID_HOME"

  # Ensure the Android platform/build-tools needed for compileSdk 33 exist
  - |
    set -e
    SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
    if [ ! -x "$SDKMANAGER" ]; then
      SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
    fi

    if [ -x "$SDKMANAGER" ]; then
      yes | "$SDKMANAGER" --licenses
      "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" "platform-tools"
    else
      echo "sdkmanager not found; relying on preinstalled Android SDK components"
    fi

  # Pin NDK to r20b (matches your existing approach)
  - curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip
  - unzip -q ndk.zip
  - rm -rf "$ANDROID_HOME/ndk-bundle"
  - mv android-ndk-r20b "$ANDROID_HOME/ndk-bundle"
  - rm -f ndk.zip

  # Make Gradle/NDK discovery deterministic
  - printf "sdk.dir=%s\nndk.dir=%s\n" "$ANDROID_HOME" "$ANDROID_HOME/ndk-bundle" > local.properties
  - cat local.properties
  - "$ANDROID_HOME/ndk-bundle/ndk-build" --version

install:
  - |
    ./gradlew --no-daemon clean \
      :libausbc:install \
      :libnative:install \
      :libuvc:install \
      -x test -x lint -x check

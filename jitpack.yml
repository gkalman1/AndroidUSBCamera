jdk:
  - openjdk8

before_install:
  - set -euxo pipefail
  - echo "JAVA_HOME=$JAVA_HOME"
  - echo "ANDROID_HOME=$ANDROID_HOME"

  # The old sdkmanager lives here on JitPack images
  - yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses
  - $ANDROID_HOME/tools/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

  # Install legacy NDK into ndk-bundle
  - curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip
  - unzip -q ndk.zip
  - rm -rf "$ANDROID_HOME/ndk-bundle"
  - mv android-ndk-r20b "$ANDROID_HOME/ndk-bundle"
  - rm -f ndk.zip

  # Force Gradle/AGP to use this NDK
  - printf "sdk.dir=%s\nndk.dir=%s\n" "$ANDROID_HOME" "$ANDROID_HOME/ndk-bundle" > local.properties

  # sanity checks
  - test -f "$ANDROID_HOME/ndk-bundle/source.properties"
  - test -x "$ANDROID_HOME/ndk-bundle/ndk-build"
  - "$ANDROID_HOME/ndk-bundle/ndk-build" --version

install:
  - ./gradlew clean publishToMavenLocal -x test

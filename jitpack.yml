jdk:
  - openjdk8

before_install:
  - set -euxo pipefail
  - pwd
  - ls -la
  - echo "ANDROID_HOME=$ANDROID_HOME"
  - echo "JAVA_HOME=$JAVA_HOME"

  # Install modern cmdline-tools sdkmanager (avoid old tools/bin/sdkmanager)
  - curl -L -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
  - mkdir -p "$ANDROID_HOME/cmdline-tools"
  - unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
  - rm -rf "$ANDROID_HOME/cmdline-tools/latest"
  - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
  - rm -f cmdline.zip
  - export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
  - yes | "$SDKMANAGER" --licenses
  - "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

  # Install legacy NDK into ndk-bundle (compatible with older AGP that calls ndk-build)
  - curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip
  - unzip -q ndk.zip
  - rm -rf "$ANDROID_HOME/ndk-bundle"
  - mv android-ndk-r20b "$ANDROID_HOME/ndk-bundle"
  - rm -f ndk.zip
  - chmod +x "$ANDROID_HOME/ndk-bundle/ndk-build" || true

  # Force Gradle/AGP to see SDK + NDK
  - printf "sdk.dir=%s\nndk.dir=%s\n" "$ANDROID_HOME" "$ANDROID_HOME/ndk-bundle" > local.properties
  - echo "----- local.properties -----"
  - cat local.properties

  # Prove ndk-build exists before Gradle runs
  - test -f "$ANDROID_HOME/ndk-bundle/source.properties"
  - test -x "$ANDROID_HOME/ndk-bundle/ndk-build"
  - "$ANDROID_HOME/ndk-bundle/ndk-build" --version

install:
  # IMPORTANT: do NOT run "clean" (that triggers :libuvc:ndkClean)
  - ./gradlew --no-daemon build publishToMavenLocal -x test

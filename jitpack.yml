jdk:
  - openjdk8   # keep if you did NOT upgrade AGP/Gradle in the library build
  # use openjdk17 if you upgraded AGP to 8.x

before_install:
  - echo "JITPACK=$JITPACK GROUP=$GROUP ARTIFACT=$ARTIFACT VERSION=$VERSION"
  # Strongly recommended for Play Store / targetSdk 35 native compatibility:
  # NDK r22 and lower is not compatible with 16 KB requirements. :contentReference[oaicite:1]{index=1}
  - wget -O ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
  - unzip -q ndk.zip
  - rm -rf $ANDROID_HOME/ndk-bundle
  - mv android-ndk-r28c $ANDROID_HOME/ndk-bundle
  - rm -f ndk.zip
  - echo "sdk.dir=$ANDROID_HOME" > local.properties
  - echo "ndk.dir=$ANDROID_HOME/ndk-bundle" >> local.properties

install:
  - |
    ./gradlew --no-daemon clean \
      -Pgroup="${GROUP}.${ARTIFACT}" \
      -Pversion="${VERSION}" \
      :libausbc:publishToMavenLocal \
      :libnative:publishToMavenLocal \
      :libuvc:publishToMavenLocal \
      -x test -x lint -x check

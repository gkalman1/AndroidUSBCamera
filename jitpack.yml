jdk:
  - openjdk8

before_install:
  - echo "JitPack before_install running"
  - echo "ANDROID_HOME=$ANDROID_HOME"
  - echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
  - echo "JAVA_HOME=$JAVA_HOME"

  # Pin NDK r28c for Android 15 / API 35 (16 KB alignment by default in r28+).
  # If you later want to rely on JitPack's preinstalled NDK instead, you can remove this block.
  - curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
  - unzip -q ndk.zip
  - rm -rf "$ANDROID_HOME/ndk-bundle"
  - mv android-ndk-r28c "$ANDROID_HOME/ndk-bundle"
  - rm -f ndk.zip
  - "$ANDROID_HOME/ndk-bundle/ndk-build" --version

install:
  - |
    export UVC_ABIS="armeabi-v7a arm64-v8a"
    export UVC_PLATFORM="android-21"
    export UVC_FLEX_PAGES="true"

    ./gradlew --no-daemon clean install -x test -x lint -x check

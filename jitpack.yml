jdk:
  - openjdk11

before_install:
  # Show environment (useful for debugging)
  - echo "ANDROID_HOME=$ANDROID_HOME"
  - echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

  # Accept licenses (otherwise sdkmanager often fails)
  - yes | sdkmanager --licenses

  # Install required SDK components (adjust versions later if needed)
  - sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

  # Install an NDK (r21e is commonly compatible with ndk-build-based projects)
  - sdkmanager "ndk;21.4.7075529"

  # Many older Gradle/AGP scripts look specifically for $ANDROID_HOME/ndk-bundle
  - ln -sfn "$ANDROID_HOME/ndk/21.4.7075529" "$ANDROID_HOME/ndk-bundle"
  - ls -la "$ANDROID_HOME" || true
  - ls -la "$ANDROID_HOME/ndk-bundle" || true

install:
  # Build + publish to Maven local (what JitPack needs to produce artifacts)
  - ./gradlew clean publishToMavenLocal -x test
